version: '3.8'

services:
  broken_auth_lab:
    build: .
    container_name: broken_auth_lab
    user: "10001:10001"
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    restart: unless-stopped 
